{% load i18n %}{% get_current_language as IDIOMA %}
{# Cambia el idioma con la vista set_language de Django (POST) y vuelve a la misma página. #}
<form action="{% url 'set_language' %}" method="post" class="flex border-2 border-linea" aria-label="{% translate 'Idioma' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <button type="submit" name="language" value="es" lang="es"
          class="min-h-10 min-w-11 px-2.5 text-xs font-bold {% if IDIOMA == 'es' %}bg-uteq-verde text-white{% else %}bg-superficie text-texto{% endif %}"
          aria-pressed="{% if IDIOMA == 'es' %}true{% else %}false{% endif %}" title="Español">ES</button>
  <button type="submit" name="language" value="en" lang="en"
          class="min-h-10 min-w-11 border-l-2 border-linea px-2.5 text-xs font-bold {% if IDIOMA == 'en' %}bg-uteq-verde text-white{% else %}bg-superficie text-texto{% endif %}"
          aria-pressed="{% if IDIOMA == 'en' %}true{% else %}false{% endif %}" title="English">EN</button>
</form>
